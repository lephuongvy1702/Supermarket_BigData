# ============================================================================
# FLUME AGENT CONFIGURATION - SUPERMARKET LOG COLLECTOR
# Công đoạn: Thu thập dữ liệu theo luồng (Streaming Acquisition)
# Mô tả: Đọc log từ thư mục spool và ghi vào HDFS
# ============================================================================

# Định nghĩa các thành phần của agent
agent.sources = r1
agent.channels = c1
agent.sinks = k1

# ============================================================================
# SOURCE: Spool Directory - Đọc file log từ thư mục
# ============================================================================
agent.sources.r1.type = spooldir
agent.sources.r1.spoolDir = /home/your_username/supermarket_logs
agent.sources.r1.channels = c1

# Cấu hình đọc file
agent.sources.r1.fileHeader = true
agent.sources.r1.fileHeaderKey = file
agent.sources.r1.basenameHeader = true
agent.sources.r1.basenameHeaderKey = filename

# Bỏ qua các file đã xử lý và file tạm
agent.sources.r1.ignorePattern = ^.*\.COMPLETED$|^.*\.tmp$|^.*\.log$

# Deserializer: xử lý mỗi dòng là một event
agent.sources.r1.deserializer = LINE
agent.sources.r1.deserializer.maxLineLength = 50000
agent.sources.r1.deserializer.outputCharset = UTF-8

# Batch size
agent.sources.r1.batchSize = 100

# Thời gian chờ giữa các lần quét
agent.sources.r1.pollDelay = 1000

# ============================================================================
# CHANNEL: Memory Channel - Lưu trữ tạm thời trong bộ nhớ
# ============================================================================
agent.channels.c1.type = memory
agent.channels.c1.capacity = 10000
agent.channels.c1.transactionCapacity = 1000
agent.channels.c1.keep-alive = 5
agent.channels.c1.byteCapacity = 800000
agent.channels.c1.byteCapacityBufferPercentage = 20

# ============================================================================
# SINK: HDFS - Ghi dữ liệu vào HDFS
# ============================================================================
agent.sinks.k1.type = hdfs
agent.sinks.k1.channel = c1

# Đường dẫn HDFS (cấu trúc thư mục theo ngày)
agent.sinks.k1.hdfs.path = hdfs://localhost:9000/data/raw/supermarket/logs/%Y-%m-%d

# Tiền tố và hậu tố file
agent.sinks.k1.hdfs.filePrefix = supermarket_%Y%m%d_%H%M
agent.sinks.k1.hdfs.fileSuffix = .json
agent.sinks.k1.hdfs.inUsePrefix = .
agent.sinks.k1.hdfs.inUseSuffix = .tmp

# Format file
agent.sinks.k1.hdfs.fileType = DataStream
agent.sinks.k1.hdfs.writeFormat = Text

# Cơ chế roll file (tạo file mới)
agent.sinks.k1.hdfs.rollInterval = 60          # Roll sau 60 giây
agent.sinks.k1.hdfs.rollSize = 10485760        # Roll khi file đạt 10MB (0 byte để tắt)
agent.sinks.k1.hdfs.rollCount = 500            # Roll sau 500 events

# Cơ chế xoay vòng thư mục
agent.sinks.k1.hdfs.round = true
agent.sinks.k1.hdfs.roundValue = 1
agent.sinks.k1.hdfs.roundUnit = hour

# Số lượng file tối đa trong thư mục
agent.sinks.k1.hdfs.maxOpenFiles = 5000

# Thời gian batch
agent.sinks.k1.hdfs.batchSize = 100
agent.sinks.k1.hdfs.threadsPoolSize = 10

# Xử lý khi HDFS không khả dụng
agent.sinks.k1.hdfs.callTimeout = 30000

# ============================================================================
# CẤU HÌNH BỔ SUNG - TÙY CHỌN
# ============================================================================

# Tùy chọn: Thêm header để lưu thông tin về nguồn dữ liệu
agent.sources.r1.interceptors = i1
agent.sources.r1.interceptors.i1.type = static
agent.sources.r1.interceptors.i1.key = source
agent.sources.r1.interceptors.i1.value = supermarket_pos
agent.sources.r1.interceptors.i1.preserveExisting = false

# ============================================================================
# GHI CHÚ SỬ DỤNG
# ============================================================================
# 1. Thay /home/your_username/supermarket_logs bằng đường dẫn thực tế
# 2. Đảm bảo HDFS đang chạy
# 3. Chạy lệnh:
#    flume-ng agent --name agent --conf-file flume_agent.conf --conf /opt/flume/conf -Dflume.root.logger=INFO,console